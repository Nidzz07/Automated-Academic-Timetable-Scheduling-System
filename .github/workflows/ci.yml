name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest

    # Same image and credentials as the `db` service in docker-compose.yml, so the
    # DB-backed tests (db/tests, ingestion/tests/test_seed_*.py) run here instead of
    # skipping. They create and drop their own scratch databases on this server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chronos
          POSTGRES_PASSWORD: chronos
          POSTGRES_DB: chronos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronos -d chronos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CHRONOS_TEST_DATABASE_URL: postgresql+psycopg2://chronos:chronos@localhost:5432/chronos
      DATABASE_URL: postgresql+psycopg2://chronos:chronos@localhost:5432/chronos
      CHRONOS_DB_PORT: "5432"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # -rs prints every skip reason, so a DB test that silently skips is visible.
        run: pytest -q -rs

  migrations:
    name: Alembic (upgrade head)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chronos
          POSTGRES_PASSWORD: chronos
          POSTGRES_DB: chronos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronos -d chronos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # localhost passes the remote-DB guard in migrations/env.py.
      # CHRONOS_ALLOW_REMOTE_DB is deliberately never set in CI.
      DATABASE_URL: postgresql+psycopg2://chronos:chronos@localhost:5432/chronos

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upgrade an empty database to head
        run: alembic upgrade head

      - name: Show the applied revision
        run: alembic current

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # package.json has no `lint` script today; this step is a no-op until one is added.
        run: npm run lint --if-present

      - name: Test
        run: npx vitest run

      - name: Build
        # `build` is `tsc && vite build`, so this is also the type-check.
        run: npm run build
