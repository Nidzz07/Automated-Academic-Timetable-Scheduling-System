# Local development stack: the API plus its own throwaway Postgres.
#
# Why a local db service at all? Three developers running `alembic upgrade head`
# against one shared Supabase instance corrupt each other's schema state. Each
# developer migrates here; Supabase is shared staging only, promoted to
# deliberately. Point DATABASE_URL in backend/.env at the db service below
# (see .env.example) for everyday work.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
      POSTGRES_DB: chronos
    ports:
      # Published so alembic/psql running on the Windows host can reach it too.
      #
      # The host port is configurable because a native PostgreSQL install on the
      # developer's machine may already own 5432 -- in which case the container
      # starts and reports healthy, but localhost:5432 silently resolves to the
      # native server and authentication fails with "password authentication
      # failed for user chronos". Set CHRONOS_DB_PORT to something free, e.g.
      #   $env:CHRONOS_DB_PORT = "5433"
      # The default is unchanged, so this is a no-op if 5432 is free.
      - "${CHRONOS_DB_PORT:-5432}:5432"
    volumes:
      - chronos_pgdata:/var/lib/postgresql/data
    healthcheck:
      # The backend must not start before Postgres is accepting connections.
      test: ["CMD-SHELL", "pg_isready -U chronos -d chronos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount the source so --reload picks up local edits.
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  chronos_pgdata:
