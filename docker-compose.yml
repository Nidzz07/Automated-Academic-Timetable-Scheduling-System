# The database is hosted Supabase Postgres — there is no local db service.
# The backend connects out to it using DATABASE_URL from backend/.env.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount the source so --reload picks up local edits.
      - .:/app
